services:
  web:
    build:
      context: ../client
    image: henla-web:dev
    ports:
      - "8080:80"
    restart: unless-stopped
  api:
    build:
      context: ../backend
    image: henla-api:dev
    ports:
      - "8000:8000"
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata: